version: '3'

vars:
  GRADLE_IMAGE: '{{default "gradle:8.8-jdk17" .GRADLE_IMAGE}}'
  RELEASE_ZIP: '../fast_git_clone.zip'

tasks:
  default:
    desc: Build the plugin upload zip
    cmds:
      - task: package

  clean:
    desc: Remove generated build artifacts
    cmds:
      - rm -rf build .gradle
      - rm -f '{{.RELEASE_ZIP}}'

  package:
    desc: Build the plugin market upload zip with Dockerized Gradle
    cmds:
      - task: clean
      - mkdir -p .gradle
      - docker run --rm -e GRADLE_USER_HOME=/workspace/.gradle -v "$PWD:/workspace" -w /workspace '{{.GRADLE_IMAGE}}' gradle --no-daemon package
      - cp build/out/fast_git_clone.zip '{{.RELEASE_ZIP}}'
      - task: verify

  verify:
    desc: Verify task.json and upload zip contents
    cmds:
      - mkdir -p .gradle
      - docker run --rm -e GRADLE_USER_HOME=/workspace/.gradle -v "$PWD:/workspace" -w /workspace '{{.GRADLE_IMAGE}}' gradle --no-daemon verifyPackage
      - |
        unzip -p '{{.RELEASE_ZIP}}' task.json | grep -q '"language": "java"'
      - |
        unzip -p '{{.RELEASE_ZIP}}' task.json | grep -q '"target": "\$bk_java_path -Dfile.encoding=UTF-8 -jar fast_git_clone.jar"'
      - unzip -p '{{.RELEASE_ZIP}}' fast_git_clone.jar >/dev/null
      - unzip -l '{{.RELEASE_ZIP}}'
